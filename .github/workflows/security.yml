name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run build
      - name: Production dependency audit
        run: npm run audit:production
