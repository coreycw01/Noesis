version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns:
          - "firebase*"
          - "@firebase/*"
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
    ignore:
      # @capacitor-firebase/authentication 8.5.2 requires Firebase ^12.6.0.
      # Remove this guard when the native authentication bridge supports v13.
      - dependency-name: "firebase"
        versions:
          - ">=13.0.0"
